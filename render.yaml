# ═══════════════════════════════════════════════════════════
#  Gestion_Employe — Blueprint Render
#  Frontend Vue (Static) + API PHP (Docker) + PostgreSQL
# ═══════════════════════════════════════════════════════════

databases:
  - name: gestion-employe-db
    plan: free
    databaseName: gestion_employe

services:
  # ── 1. API PHP (Web Service + Docker) ─────────────────────
  - type: web
    name: gestion-employe-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-employe-db
          property: externalConnectionString

  # ── 2. Frontend Vue (Static Site) ─────────────────────────
  - type: web                      # ← "web" (et non "static")
    name: gestion-employe-frontend
    runtime: static                # ← runtime "static"
    rootDir: frontend/Gestion-Employe
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VUE_APP_API_URL
        value: https://gestion-employe-api.onrender.com
